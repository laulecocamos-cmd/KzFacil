<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KzFácil</title>
<style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#0866d6;color:#fff;padding:18px 6%;display:flex;justify-content:space-between}.wrap{max-width:900px;margin:auto;padding:30px 6%}.hero{background:#0866d6;color:#fff;padding:40px 6%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.card{background:#fff;padding:18px;border-radius:12px;box-shadow:0 3px 15px #0001}.btn{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;background:#ffd43b;font-weight:bold}input,select,textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccd3df;border-radius:8px;box-sizing:border-box}.muted{color:#667085}.hidden{display:none}.danger{background:#fee4e2}</style>
<header><b>Kz<span style="color:#ffd43b">Fácil</span></b><span id="user"></span></header>
<section class="hero"><div class="wrap"><h1>Serviços do dia a dia, num só lugar.</h1><p>Pedidos em Kz com acompanhamento online.</p></div></section>
<main class="wrap"><div id="auth"><div class="card"><h2>Criar conta / Entrar</h2><input id="name" placeholder="Nome"><input id="phone" placeholder="Telefone"><input id="pass" type="password" placeholder="Senha"><button class="btn" onclick="register()">Criar conta</button> <button class="btn" onclick="login()">Entrar</button></div></div>
<div id="app" class="hidden"><h2>Serviços</h2><div id="services" class="grid"></div><h2>Meus pedidos</h2><div id="orders"></div></div>
<div id="admin" class="hidden"><h2>Painel administrativo</h2><div id="stats"></div><div id="adminorders"></div></div></main>
<script>
let token=localStorage.token||"",me=JSON.parse(localStorage.me||"null");const api=x=>fetch("/api"+x,{headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})}});
async function register(){let r=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,phone:phone.value,password:pass.value})});let j=await r.json();if(!r.ok)return alert(j.error);set(j)}
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:phone.value,password:pass.value})});let j=await r.json();if(!r.ok)return alert(j.error);set(j)}
function set(j){token=j.token;me=j.user;localStorage.token=token;localStorage.me=JSON.stringify(me);auth.classList.add("hidden");app.classList.remove("hidden");user.textContent=me.name;load();if(me.role==="admin")admin.classList.remove("hidden"),loadAdmin()}
async function load(){let s=await (await api("/services")).json();services.innerHTML=s.map(x=>`<div class=card><h3>${x.name}</h3><p class=muted>${x.description}</p><b>${x.price.toLocaleString()} Kz</b><br><button class=btn onclick="order(${x.id})">Pedir</button></div>`).join("");let o=await(await api("/orders/me")).json();orders.innerHTML=o.map(x=>`<div class=card><b>${x.code}</b> — ${x.service_name}<br>${x.price.toLocaleString()} Kz · ${x.status}</div>`).join("")||"Sem pedidos."}
async function order(id){let d=prompt('Descreva o que precisa:');if(!d)return;let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({service_id:id,details:d})});let j=await r.json();if(!r.ok)return alert(j.error||'Erro ao criar pedido');alert('Pedido '+j.code+' criado com sucesso.');load();}
async function loadAdmin(){let s=await(await api("/admin/stats")).json();stats.innerHTML=`<div class=card>Pedidos: <b>${s.orders}</b> · Comissão: <b>${s.commission.toLocaleString()} Kz</b> · Pendentes: <b>${s.pending}</b></div>`;let o=await(await api("/admin/orders")).json();adminorders.innerHTML=o.map(x=>`<div class=card><b>${x.code}</b> — ${x.service_name}<br>${x.customer} · ${x.phone}<br>${x.price.toLocaleString()} Kz · comissão ${x.commission.toLocaleString()} Kz<br>${x.status}</div>`).join("")}
</script></html>
